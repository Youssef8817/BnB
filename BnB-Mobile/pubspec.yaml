name: b_and_b
description: A new Flutter project.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0
  dio: ^5.4.3
  go_router: ^14.2.0
  shared_preferences: ^2.2.2
  image_picker: ^1.0.7
  cached_network_image: ^3.3.1
  url_launcher: ^6.2.5
  flutter_rating_bar: ^4.0.1
  flutter_svg: ^2.0.10

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1
  flutter_native_splash: ^2.4.0

flutter:
  uses-material-design: true
  assets:
    - assets/logo/

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/logo/Logo_padded.png"
  adaptive_icon_background: "#110A24"
  adaptive_icon_foreground: "assets/logo/Logo_padded.png"

flutter_native_splash:
  color: "#110A24"
  image: "assets/logo/Logo_splash_shadow.png"
  android_12:
    image: "assets/logo/Logo_splash_shadow.png"
    icon_background_color: "#110A24"